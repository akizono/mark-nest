<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MarkNest</title>
  <link rel="stylesheet" href="../assets/shared.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <img src="../assets/icons/icon32.png" alt="" width="18" height="18" />
        <div class="name">MarkNest</div>
      </div>
      <div class="top-actions">
        <button id="btnAdd" class="primary" data-i18n="addThisTab">Add this tab</button>
        <button id="btnSettings" class="ghost" data-i18n="settings" title="Settings">Set</button>
      </div>
    </header>

    <div id="viewGate" class="panel hidden">
      <div id="gateMessage" class="stack"></div>
    </div>

    <div id="viewUnlock" class="panel hidden">
      <h2 data-i18n="unlockTitle">Unlock MarkNest</h2>
      <div class="field">
        <label data-i18n="password">Password</label>
        <input id="unlockPassword" type="password" autocomplete="current-password" data-i18n-placeholder="passwordHint" />
      </div>
      <div class="row" style="margin-top:10px; justify-content:flex-end;">
        <button id="btnUnlock" class="primary" data-i18n="unlock">Unlock</button>
      </div>
      <p id="unlockError" class="banner error hidden"></p>
    </div>

    <div id="viewMain" class="panel hidden">
      <div id="manualBanner" class="banner hidden" data-i18n="manualModeBanner"></div>
      <div class="search-row">
        <input id="searchInput" type="text" data-i18n-placeholder="searchPlaceholder" />
      </div>
      <div class="toolbar">
        <button id="btnNewFolder" class="primary" data-i18n="newFolder">New folder</button>
        <button id="btnRefresh" data-i18n="checkStatus">Refresh</button>
        <button id="btnBatch" data-i18n="batchManage">Batch</button>
      </div>
      <div id="batchBar" class="batch-bar hidden">
        <label class="batch-select-all"><input type="checkbox" id="chkSelectAll" /> <span data-i18n="selectAll">Select all</span></label>
        <span id="batchCount" class="muted"></span>
        <button id="btnBatchDelete" class="danger" data-i18n="batchDelete">Delete</button>
        <button id="btnBatchDone" data-i18n="batchDone">Done</button>
      </div>
      <div id="tree" class="tree"></div>
      <div id="searchResults" class="tree hidden"></div>
    </div>

    <footer class="bottom">
      <div id="statusText" class="muted status"></div>
      <button id="btnLock" class="ghost hidden" data-i18n="lock">Lock</button>
    </footer>
  </div>

  <div id="dialogRoot"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
