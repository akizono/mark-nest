<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MarkNest — Add</title>
  <link rel="stylesheet" href="../assets/shared.css" />
  <link rel="stylesheet" href="pages.css" />
</head>
<body>
  <main class="page">
    <header class="page-header">
      <img src="../assets/icons/icon32.png" width="22" height="22" alt="" />
      <div>
        <h1 data-i18n="addBookmark">Add bookmark</h1>
        <p class="muted">MarkNest</p>
      </div>
    </header>

    <section id="gate" class="card stack hidden"></section>

    <section id="form" class="card stack hidden">
      <div class="field">
        <label data-i18n="title">Title</label>
        <input id="title" type="text" />
      </div>
      <div class="field">
        <label data-i18n="url">URL</label>
        <input id="url" type="url" />
      </div>
      <div class="field">
        <label data-i18n="folder">Folder</label>
        <div id="folderPicker"></div>
      </div>
      <p id="msg" class="banner hidden"></p>
      <div class="row" style="justify-content:flex-end">
        <button id="btnCancel" data-i18n="cancel">Cancel</button>
        <button id="btnSave" class="primary" data-i18n="save">Save</button>
      </div>
    </section>
  </main>
  <script type="module" src="add-bookmark.js"></script>
</body>
</html>
